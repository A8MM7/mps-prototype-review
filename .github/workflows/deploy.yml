name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download QA-verified prototype build
        env:
          SOURCE_COMMIT: '8ba4496c99ea3d9f314cbb18c42b3ea2e6e36a8a'
          BUILD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2790-8210-a5e5-328bac0565ad/raw?se=2026-09-15T13%3A00%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=45515f81-2acd-5271-a0ef-8766fd3da2f9&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A32%3A18Z&ske=2026-09-16T08%3A32%3A18Z&sks=b&skv=2026-02-06&sig=Q2qcpQraaLt3DFwuNjmHHinybFN8mdyeIJPFZ2st7ps%3D'
        run: |
          echo "Publishing QA-verified source commit $SOURCE_COMMIT"
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
