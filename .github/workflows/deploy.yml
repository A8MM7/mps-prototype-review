name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download QA-verified prototype build
        env:
          SOURCE_COMMIT: 'cec3a22f42f79f24ab4442320d1cc48d50d82ef9'
          BUILD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2ee8-81f4-96e4-fb1e35ddb537/raw?se=2026-09-15T13%3A12%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=670cbfdd-42b7-5220-86f9-cf1c00788f2c&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A15%3A26Z&ske=2026-09-16T05%3A15%3A26Z&sks=b&skv=2026-02-06&sig=Z%2Bn3JNujvq5dOTO/eywccjG%2Bi1B36tdQtgC5miFo1GM%3D'
        run: |
          echo "Publishing QA-verified source commit $SOURCE_COMMIT"
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
