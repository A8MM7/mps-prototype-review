name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download QA-verified prototype build
        env:
          SOURCE_COMMIT: '3b0065b71aa44a20a85149cf53c9600a16dbf81d'
          BUILD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1cf8-81f4-8d36-409b75a2d32c/raw?se=2026-09-14T22%3A04%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=bb19828d-27d8-5667-b824-d320ae7839b3&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A05%3A10Z&ske=2026-09-15T20%3A05%3A10Z&sks=b&skv=2026-02-06&sig=dWHshDEAfsPFS7KKrLat3NljOgfl13tRkJSaCrvU55I%3D'
        run: |
          echo "Publishing QA-verified source commit $SOURCE_COMMIT"
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
