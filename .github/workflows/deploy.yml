name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download QA-verified prototype build
        env:
          SOURCE_COMMIT: '44612418f5198e07e7d815c9a7c2d62e5cd1be15'
          BUILD_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-cf20-820a-b7ef-105b1019cd37/raw?se=2026-09-15T12%3A34%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=bba07b9b-7878-5d4a-841e-aa5791b59dbf&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A32%3A19Z&ske=2026-09-16T08%3A32%3A19Z&sks=b&skv=2026-02-06&sig=X0Sfg5daPG3uCC1X/Os/skKxOIwkO0CicuKJKNskNhw%3D'
        run: |
          echo "Publishing QA-verified source commit $SOURCE_COMMIT"
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
