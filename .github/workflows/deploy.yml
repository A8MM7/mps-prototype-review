name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download QA-verified prototype build
        env:
          SOURCE_COMMIT: '616920eea66194dca1e4e92cef7fbf73a9dd9fe1'
          BUILD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-261c-8210-9a46-8e4daa13f58f/raw?se=2026-09-14T21%3A44%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=09b1756c-4c27-52f1-92f2-672a31079623&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A07%3A39Z&ske=2026-09-15T20%3A07%3A39Z&sks=b&skv=2026-02-06&sig=exUts4cdDrAENv92TNCdc4zNm16cHfkoiev%2BLaYSKeI%3D'
        run: |
          echo "Publishing QA-verified source commit $SOURCE_COMMIT"
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
