name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6

      - name: Prepare QA-tested review site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          if [[ -f index.html && -f app.js && -f styles.css && -f MPS_UI_UX_Prototype.html ]]; then
            echo "Publishing QA-tested files committed by private Prototype CI."
            cp index.html app.js styles.css MPS_UI_UX_Prototype.html site/
            if [[ -f BUILD_PROVENANCE.txt ]]; then
              cp BUILD_PROVENANCE.txt site/
              cat BUILD_PROVENANCE.txt
            fi
          else
            echo "Direct QA build is not present yet; using the legacy verified-artifact manifest."
            source DEPLOY_SOURCE.env
            echo "Publishing QA-verified source commit $SOURCE_COMMIT"
            echo "Private CI run $CI_RUN · artifact $ARTIFACT_ID"
            curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
            echo "$ARTIFACT_SHA256  /tmp/mps-prototype-build.zip" | sha256sum -c -
            unzip -q /tmp/mps-prototype-build.zip -d site
          fi

          test -f site/index.html
          test -f site/app.js
          test -f site/styles.css
          test -f site/MPS_UI_UX_Prototype.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
