name: Deploy MPS Prototype Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download latest green prototype build
        env:
          BUILD_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-48d0-8243-af27-183c0dcfbb20/raw?se=2026-09-14T17%3A07%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=438821eb-07ce-5091-b9f3-031b44b17204&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T08%3A51%3A02Z&ske=2026-09-15T08%3A51%3A02Z&sks=b&skv=2026-02-06&sig=LNXjEj4liAjfIRSeBKQ0snZgiNjn3vrwDXfaBeDaARc%3D'
        run: |
          mkdir -p site
          curl -L --fail --retry 3 "$BUILD_URL" -o /tmp/mps-prototype-build.zip
          unzip -q /tmp/mps-prototype-build.zip -d site
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
