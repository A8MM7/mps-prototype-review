<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
(function(){
  const currentBuild='5904befaf58b';
  fetch('version.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok) throw new Error('version check failed'); return r.json();})
    .then(function(v){
      if(!v || !v.assetVersion || v.assetVersion===currentBuild) return;
      const u=new URL(window.location.href);
      u.searchParams.set('build',v.assetVersion);
      u.searchParams.set('_',Date.now().toString());
      window.location.replace(u.toString());
    })
    .catch(function(){});
})();
</script>
<title>Eliira — Product Prototype</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/eliira-favicon.svg?v=5904befaf58b">
<link rel="preload" href="assets/fonts/manrope-v20-latin-400-700.woff2?v=5904befaf58b" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=5904befaf58b">
</head>
<body>
<div id="root"><main id="app-load-status" role="status" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8f8;color:#123f42;font:16px/1.5 sans-serif"><div style="width:min(100%,420px);padding:24px;border:1px solid #cbdedc;border-radius:16px;background:white"><strong>Eliira</strong><h1 style="font-size:22px">Opening Eliira…</h1></div></main></div>
<div id="overlay"></div>

<style>
.prototype-persona{display:flex;align-items:center;gap:8px;min-width:0}.prototype-persona span{font-size:8px;text-transform:uppercase;letter-spacing:.45px;color:#5f7280;font-weight:850}.prototype-persona select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;color:var(--navy);font-size:10px;font-weight:750}.review-harness{margin:14px 24px 0;padding:9px 12px;border:1px dashed #bfd6e2;background:#f5fbfd;border-radius:11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#5f7280;font-size:9px}.review-harness strong{color:var(--navy);font-size:10px}.timeline{border-left:2px solid #cbd8df;margin:14px 0 0 9px;padding-left:18px}.timeline-item{position:relative;margin-bottom:16px}.timeline-item:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--navy);left:-24px;top:3px}.timeline-item b{font-size:11px;color:var(--navy)}.timeline-item div{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.45}.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px;background:#fafcfd}.money{font-size:26px;font-weight:900;color:var(--navy);letter-spacing:-.4px}.prototype-note{font-size:9px;color:var(--muted)}.text-link{border:0;background:transparent;padding:0;color:var(--navy);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.text-link:hover{color:var(--blue)}
.prototype-review-date{display:flex;align-items:center;gap:6px;min-width:0;font-size:10px;font-weight:750;color:var(--navy)}.prototype-review-date select{max-width:190px;min-height:30px;border:1px solid #bfd6e2;border-radius:8px;padding:4px 7px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}
@media(max-width:780px){.review-harness{margin:8px 12px 0;padding:8px 10px}.review-harness>span{display:none}.prototype-persona span{display:none}.prototype-persona select{max-width:150px}.search{display:none}.case-layout{display:flex!important;flex-direction:column}.case-workspace{order:1}.case-list{order:2;max-height:220px;overflow:auto}.topbar{gap:8px}.week-board{display:block!important}.tabs{scrollbar-width:thin}.tab{flex:0 0 auto}.drawer .modal-body{padding-bottom:90px}}
@media(max-width:780px){.review-harness strong{display:none}.prototype-review-date{gap:4px}.prototype-review-date select{box-sizing:border-box;width:135px;max-width:135px}.review-harness .prototype-persona select{box-sizing:border-box;width:95px;max-width:95px}}
</style>
<script src="app.js?v=5904befaf58b"></script>
<script>
(function(){
  var root=document.getElementById('root');
  if(!root||root.textContent.trim()&&!document.getElementById('app-load-status'))return;
  root.innerHTML='<main role="alert" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8f8;color:#123f42;font:16px/1.5 sans-serif"><div style="width:min(100%,420px);padding:24px;border:1px solid #cbdedc;border-radius:16px;background:white"><strong>Eliira</strong><h1 style="font-size:22px">Eliira could not open</h1><p>Check your connection and try again. Saved information on this device has not been cleared.</p><button type="button" onclick="location.reload()" style="min-height:44px;padding:10px 18px;border:0;border-radius:8px;background:#0d514d;color:white;font:inherit">Try again</button></div></main>';
})();
</script>
</body>
</html>
